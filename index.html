<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Alphabet Words</title>

<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="My Words" />
<meta name="theme-color" content="#EAF1F6" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg:#EAF1F6; --bg-top:#F3F8FB; --card:#FFFFFF;
    --ink:#2B3242; --muted:#79899B;
    --amber:#F59E0B; --amber-ink:#7A4A06; --amber-soft:#FDEBC8;
    --teal:#12B3A2; --teal-soft:#D2F2EE; --teal-ink:#0A6F64;
    --tile-rest:#F4F7FA; --tile-edge:#E2EAF1;
    --shadow:0 10px 30px rgba(43,50,66,.10);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:0; }
  body {
    font-family:"Nunito",system-ui,sans-serif; color:var(--ink);
    background:linear-gradient(180deg,var(--bg-top),var(--bg));
    min-height:100vh; min-height:100dvh; padding:clamp(16px,4vw,40px);
    display:flex; flex-direction:column; align-items:center;
  }
  header { width:100%; max-width:720px; display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:clamp(10px,1.8vh,16px); }
  .brand { font-family:"Fredoka",sans-serif; font-weight:600; font-size:clamp(20px,3.4vw,28px); }
  .brand .dot { color:var(--amber); }
  .page-link { font-weight:800; font-size:clamp(12px,2.2vw,14px); text-decoration:none; color:var(--ink); background:#fff; border-radius:999px; padding:8px 14px; box-shadow:var(--shadow); }
  .progress { width:100%; max-width:720px; text-align:center; font-weight:800; color:var(--muted); font-size:clamp(13px,2.3vw,16px); margin-bottom:clamp(12px,2.2vh,20px); }

  main { width:100%; max-width:720px; flex:1; display:flex; flex-direction:column; justify-content:center; gap:clamp(14px,2.4vh,22px); }
  .card { background:var(--card); border-radius:26px; box-shadow:var(--shadow); padding:clamp(20px,3.8vw,34px); text-align:center; display:flex; flex-direction:column; align-items:center; }
  .card-top { display:flex; align-items:center; gap:12px; margin-bottom:clamp(12px,2vh,18px); }
  .letter-badge { font-family:"Fredoka",sans-serif; font-weight:700; height:clamp(44px,8vw,58px); min-width:clamp(64px,13vw,86px); padding:0 12px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:clamp(24px,5vw,34px); color:#fff; background:var(--teal); letter-spacing:.04em; box-shadow:0 8px 18px rgba(18,179,162,.30); }
  .syl-tag { font-weight:800; font-size:clamp(11px,2vw,13px); text-transform:uppercase; letter-spacing:.1em; color:var(--muted); background:var(--tile-rest); border-radius:999px; padding:6px 12px; }
  .word { display:flex; flex-wrap:wrap; justify-content:center; gap:clamp(5px,1.2vw,10px); cursor:pointer; user-select:none; margin:0 auto; padding:4px; border:none; background:none; }
  .syl { font-family:"Fredoka",sans-serif; font-weight:600; font-size:clamp(40px,10vw,76px); line-height:1; color:var(--ink); background:var(--tile-rest); border:2px solid var(--tile-edge); border-radius:16px; padding:clamp(8px,2vw,18px) clamp(12px,2.6vw,24px); transition:transform .18s ease, background .18s ease, color .18s ease, box-shadow .18s ease, border-color .18s ease; }
  .syl.active { background:var(--amber); border-color:var(--amber); color:#fff; transform:translateY(-5px) scale(1.05); box-shadow:0 12px 24px rgba(245,158,11,.40); }
  .syl.done { background:var(--amber-soft); border-color:var(--amber-soft); color:var(--amber-ink); }
  .sound-row { margin-top:clamp(14px,2.4vh,20px); display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  button.action { font-family:"Nunito",sans-serif; font-weight:800; font-size:clamp(14px,2.3vw,16px); border:none; border-radius:999px; padding:12px 20px; cursor:pointer; transition:transform .12s ease, opacity .2s ease; }
  button.action:active { transform:scale(.96); }
  button.action:focus-visible { outline:3px solid var(--ink); outline-offset:3px; }
  button.action[disabled] { opacity:.45; cursor:default; }
  .syllables-btn { background:var(--amber); color:#fff; }
  .whole-btn { background:var(--teal-soft); color:var(--teal-ink); }
  .build-hint { margin-top:clamp(12px,2vh,18px); font-weight:700; color:var(--teal); font-size:clamp(13px,2.1vw,15px); }
  .nospeech, .nobank { display:none; background:#FFF3F0; color:#B23A1B; border-radius:14px; padding:12px 16px; font-weight:700; font-size:14px; margin-bottom:16px; text-align:center; max-width:720px; width:100%; }
  @media (prefers-reduced-motion: reduce) { .syl, button.action { transition:none; } .syl.active { transform:none; } }
</style>
</head>
<body>

  <div class="nospeech" id="nospeech">This iPad can't play the word sounds right now. He can still read each word and build it.</div>
  <div class="nobank" id="nobank">Could not load the word list (words.js). Make sure words.js is in the same folder as this page.</div>

  <header>
    <div class="brand">My Words<span class="dot">.</span></div>
    <a class="page-link" href="sounds.html">Sounds →</a>
  </header>

  <div class="progress" id="progress">&nbsp;</div>

  <main id="cards"><!-- today's word cards are injected here --></main>

<!-- The word bank: 500+ words grouped by letter and syllable count. -->
<script src="words.js"></script>

<script>
/* =========================================================================
   HOW THIS WORKS (no buttons — it changes by itself each day)
   -------------------------------------------------------------------------
   - Two words show automatically each day, moving A -> Z. Each letter takes
     two days: Day 1 (a 1- and 2-syllable word) and Day 2 (a 2- and
     3-syllable word).
   - Which day it is is COUNTED from "startDate" in the file schedule.json.
     Today's words are chosen automatically; tomorrow it advances on its own.
   - The words for a given day are fixed for that whole day (they don't change
     when you reload), but each new day brings new random words from the bank.

   TO RESET to the very beginning (letter A, Day 1):
     open schedule.json and set "startDate" to today's date, e.g. "2026-06-14".
   TO JUMP AHEAD: set an earlier startDate.

   Files needed together in the repo: index.html, words.js, schedule.json.
   (sounds.html is the separate Letter Sounds page.)
   ========================================================================= */

  if (typeof BANK === "undefined") { document.getElementById("nobank").style.display = "block"; }
  const SAFE_BANK = (typeof BANK !== "undefined") ? BANK : {};
  const ALPHABET = Object.keys(SAFE_BANK).sort();        // A..Z
  const TOTAL_DAYS = Math.max(1, ALPHABET.length * 2);

  function bucket(letter, n) { return (SAFE_BANK[letter] && SAFE_BANK[letter][String(n)]) || []; }

  // Small seeded random so a given day always picks the same words.
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function todayISO() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function dayNumber(startISO) {
    const p = String(startISO).split("-").map(Number);
    const start = new Date(p[0], (p[1]||1)-1, p[2]||1);
    const now = new Date();
    const a = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const b = new Date(start.getFullYear(), start.getMonth(), start.getDate());
    return Math.round((a - b) / 86400000);
  }

  function composeDay(dayIndex) {
    const letter = ALPHABET[Math.floor(dayIndex / 2)];
    const part = (dayIndex % 2) + 1;                       // 1 or 2
    const counts = (part === 1) ? [1, 2] : [2, 3];
    const rng = mulberry32(dayIndex + 1);                  // same day => same words
    const exclude = new Set();
    if (part === 2) {                                      // Day 2 = new words, not Day 1's
      composeDay(dayIndex - 1).items.forEach(it => exclude.add(it.word.text));
    }
    const items = [];
    counts.forEach(n => {
      const arr = bucket(letter, n);
      let pool = arr.filter(w => !exclude.has(w.text));
      if (!pool.length) pool = arr;                        // fallback if pool emptied
      if (pool.length) {
        const w = pool[Math.floor(rng() * pool.length)];
        items.push({ letter: letter, word: w });
        exclude.add(w.text);
      }
    });
    return { letter: letter, part: part, items: items };
  }

  // ---- Speech -------------------------------------------------------------
  const synth = window.speechSynthesis;
  let chosenVoice = null, busy = false;
  function pickVoice() {
    if (!synth) return;
    const voices = synth.getVoices() || [];
    chosenVoice = voices.find(v => /en[-_]US/i.test(v.lang) && /female|samantha|karen|moira/i.test(v.name)) ||
      voices.find(v => /en[-_]US/i.test(v.lang)) || voices.find(v => /^en/i.test(v.lang)) || voices[0] || null;
  }
  if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; }
  else { document.getElementById("nospeech").style.display = "block"; }

  function speakSequence(pieces, rate, onStep, onDone) {
    if (!synth) { onStep(-1); onDone(); return; }
    synth.cancel();
    let i = 0;
    (function next() {
      if (i >= pieces.length) { onStep(-1); onDone(); return; }
      onStep(i);
      const u = new SpeechSynthesisUtterance(pieces[i]);
      if (chosenVoice) u.voice = chosenVoice;
      u.lang = (chosenVoice && chosenVoice.lang) || "en-US";
      u.rate = rate; u.pitch = 1;
      let advanced = false;
      const advance = () => { if (advanced) return; advanced = true; i++; next(); };
      u.onend = advance; u.onerror = advance;
      setTimeout(advance, Math.max(650, pieces[i].length * 130) + 500);
      synth.speak(u);
    })();
  }
  function sylShow(s) { return (typeof s === "string") ? s : s.show; }
  function sylSay(s)  { return (typeof s === "string") ? s : (s.say || s.show); }
  function cap(str)   { return str ? str.charAt(0).toUpperCase() + str.slice(1) : str; }

  // ---- Cards --------------------------------------------------------------
  const allTiles = [];
  function setBusyAll(s) { busy = s; document.querySelectorAll(".action").forEach(b => b.disabled = s); }
  function clearAllTiles() { allTiles.forEach(t => t.classList.remove("active", "done")); }

  function makeCard(entry) {
    const w = entry.word;
    const card = document.createElement("section"); card.className = "card";
    const top = document.createElement("div"); top.className = "card-top";
    const badge = document.createElement("div"); badge.className = "letter-badge";
    badge.textContent = entry.letter.toUpperCase() + entry.letter.toLowerCase();
    const tag = document.createElement("div"); tag.className = "syl-tag";
    const n = w.syllables.length; tag.textContent = n + (n === 1 ? " syllable" : " syllables");
    top.appendChild(badge); top.appendChild(tag); card.appendChild(top);

    const wordBtn = document.createElement("button"); wordBtn.className = "word";
    wordBtn.setAttribute("aria-label", "Hear the syllables of " + w.text);
    const tiles = w.syllables.map((syl, idx) => {
      const span = document.createElement("span"); span.className = "syl";
      span.textContent = (idx === 0) ? cap(sylShow(syl)) : sylShow(syl);
      wordBtn.appendChild(span); allTiles.push(span); return span;
    });
    card.appendChild(wordBtn);

    const row = document.createElement("div"); row.className = "sound-row";
    const sylBtn = document.createElement("button"); sylBtn.className = "action syllables-btn"; sylBtn.textContent = "🔊 Hear syllables";
    const wholeBtn = document.createElement("button"); wholeBtn.className = "action whole-btn"; wholeBtn.textContent = "🗣️ Whole word";
    row.appendChild(sylBtn); row.appendChild(wholeBtn); card.appendChild(row);

    const hint = document.createElement("div"); hint.className = "build-hint";
    hint.innerHTML = "Build it with capital or small letters 🧲"; card.appendChild(hint);

    function playSyllables() {
      if (busy) return; setBusyAll(true); clearAllTiles();
      speakSequence(w.syllables.map(sylSay), 0.75,
        (idx) => tiles.forEach((t, k) => { t.classList.toggle("active", k === idx); if (idx !== -1 && k < idx) t.classList.add("done"); }),
        () => { tiles.forEach(t => t.classList.add("done")); setBusyAll(false); });
    }
    function playWhole() {
      if (busy) return; setBusyAll(true); clearAllTiles();
      tiles.forEach(t => t.classList.add("active"));
      speakSequence([w.say || w.text], 0.85, () => {}, () => { tiles.forEach(t => t.classList.remove("active")); setBusyAll(false); });
    }
    wordBtn.addEventListener("click", playSyllables);
    sylBtn.addEventListener("click", playSyllables);
    wholeBtn.addEventListener("click", playWhole);
    return card;
  }

  const cardsEl = document.getElementById("cards"), progressEl = document.getElementById("progress");

  function renderDay(dayIndex) {
    const day = composeDay(dayIndex);
    if (synth) synth.cancel();
    busy = false; allTiles.length = 0; cardsEl.innerHTML = "";
    day.items.forEach(entry => cardsEl.appendChild(makeCard(entry)));
    progressEl.textContent = "Letter " + day.letter + " · Day " + day.part + " of 2";
  }

  // ---- Load schedule.json (start date), then show today's words -----------
  async function loadStartDate() {
    try {
      const r = await fetch("schedule.json", { cache: "no-store" });
      if (r.ok) { const j = await r.json(); if (j && j.startDate) return j.startDate; }
    } catch (e) {}
    return todayISO();   // fallback: start today
  }

  (async function init() {
    if (ALPHABET.length === 0) {
      cardsEl.innerHTML = '<section class="card"><p style="font-weight:700;color:#79899B;">No words found. Check that words.js loaded.</p></section>';
      return;
    }
    const startISO = await loadStartDate();
    let dayIndex = dayNumber(startISO);
    if (isNaN(dayIndex)) dayIndex = 0;
    dayIndex = Math.min(Math.max(dayIndex, 0), TOTAL_DAYS - 1);  // clamp A..Z
    renderDay(dayIndex);
  })();
</script>
</body>
</html>
